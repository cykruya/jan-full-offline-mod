# Builds the Windows installer of the offline fork on GitHub-hosted runners.
# Nothing is signed or published: the setup exe is an artifact of the run.
name: offline-windows-installer

on:
  workflow_dispatch:
  push:
    branches: [offline]

permissions:
  contents: read

jobs:
  # The help file is compiled with chmcmd, a single apt package on Linux; the
  # Windows image carries no CHM compiler.
  help:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
      - name: Build the help file
        run: |
          sudo apt-get update
          sudo apt-get install -y fp-utils
          corepack enable
          yarn config set -H enableImmutableInstalls false
          yarn install
          yarn build:help
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: help
          path: src-tauri/resources/help/Jan.chm
          if-no-files-found: error

  installer:
    needs: help
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6.0.2

      # make runs its recipes through Git's sh, with the coreutils in usr\bin.
      # That directory is appended, not prepended: it also holds GNU link,
      # which must not shadow MSVC's link.exe for rustc.
      - name: Put Git Bash and make on PATH
        shell: pwsh
        run: |
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\cmd'
          Add-Content $env:GITHUB_PATH 'C:\Program Files\Git\bin'
          Add-Content $env:GITHUB_ENV "PATH=$env:PATH;C:\Program Files\Git\usr\bin"
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make -y --no-progress
            Add-Content $env:GITHUB_PATH 'C:\ProgramData\chocolatey\bin'
          }

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable

      - name: Config Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
          yarn config set -H enableImmutableInstalls false

      # The variant of the official releases: CUDA 13 for NVIDIA, Vulkan for
      # every other GPU, CPU as the fallback.
      - name: Set up the llama.cpp engine toolchain
        uses: ./.github/actions/setup-engine-toolchain
        with:
          variant: cuda13-vulkan

      - uses: actions/download-artifact@v4.3.0
        with:
          name: help
          path: src-tauri/resources/help

      # `make build` without `yarn build:help`, whose output the help job made.
      - name: Build the installer
        shell: bash
        run: |
          make install-and-build
          make build-engine
          yarn build:icon
          yarn copy:assets:tauri
          yarn download:bin
          yarn tauri build --bundles nsis

      - uses: actions/upload-artifact@v4.6.2
        with:
          name: jan-offline-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
